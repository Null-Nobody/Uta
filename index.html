<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#09090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.085);--ln:rgba(255,255,255,.08);--tx:#eceaf6;--dim:#7e7e94;--c:#5ef2ff;--v:#a66bff;--p:#ff4fd8;--g:linear-gradient(120deg,#5ef2ff,#a66bff 55%,#ff4fd8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(70% 38% at 8% 0,rgba(166,107,255,.17),transparent 70%),radial-gradient(60% 34% at 100% 6%,rgba(94,242,255,.1),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"SHADE REIGN";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:800 15vw/1 Syne,Manrope,sans-serif;letter-spacing:.12em;opacity:.028;pointer-events:none;text-align:center}
svg{width:22px;height:22px;fill:currentColor;display:block}
.st svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(var(--bg) 40%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font:800 15px Syne,sans-serif;letter-spacing:.34em}
.brand b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.brand svg{width:18px;height:18px;color:var(--v);filter:drop-shadow(0 0 6px var(--v))}
.brand small{font:600 8px Manrope,sans-serif;letter-spacing:.24em;color:var(--dim);margin-left:2px}
main{max-width:940px;margin:auto;padding:2px 20px 200px;position:relative}
h1{font:800 32px Syne,sans-serif;margin:8px 0 4px;letter-spacing:-.01em}
h3{font:700 12px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:30px 0 12px;color:var(--dim)}
.sub{color:var(--dim);margin:0;font-size:14px}
.view{display:none}.view.on{display:block;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sb{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:0 18px;margin-top:8px;color:var(--dim);transition:.2s}
.sb:focus-within{border-color:var(--v);box-shadow:0 0 0 3px rgba(166,107,255,.15),0 0 28px -6px var(--v)}
.sb input{flex:1;background:none;border:0;outline:none;color:var(--tx);font:500 16px Manrope,sans-serif;padding:16px 0}
.chips{display:flex;gap:8px;margin:14px 0}
.hs{overflow-x:auto;scrollbar-width:none}.hs::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--dim);font:600 13px Manrope,sans-serif;cursor:pointer;transition:.2s}
.chip:hover{color:var(--tx);border-color:var(--v)}
.chip.on{color:#fff;border-color:var(--c);box-shadow:0 0 18px -4px var(--c);background:rgba(94,242,255,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.hrow{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 -20px;padding-left:20px;padding-right:20px}
.hrow .card{flex:0 0 148px;scroll-snap-align:start}
.card{cursor:pointer;transition:transform .2s}
.card:active{transform:scale(.97)}
.card img,.card .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:var(--s1);border:1px solid var(--ln);transition:.25s}
.card:hover img{box-shadow:0 14px 34px -12px var(--v);border-color:rgba(166,107,255,.5)}
.card .t{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;transition:background .2s}
.row:hover,.row:active{background:var(--s1)}
.row img,.ph{width:50px;height:50px;border-radius:12px;object-fit:cover;background:var(--s1);flex:none}
.row.artist img{border-radius:50%}
.meta{flex:1;min-width:0;cursor:pointer}
.t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.now>.meta .t,.card.now .t{color:var(--c);text-shadow:0 0 14px rgba(94,242,255,.55)}
.ib{background:none;border:0;color:var(--dim);padding:8px;cursor:pointer;border-radius:50%;transition:.2s}
.ib:hover{color:var(--tx)}
.ib.on,.liked{color:var(--p);filter:drop-shadow(0 0 7px var(--p))}
.liked svg{fill:currentColor}
.btn{display:inline-block;padding:11px 20px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:600 14px Manrope,sans-serif;margin:0 8px 8px 0;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--v)}
.btn.red{border:0;background:var(--g);color:#06060a;box-shadow:0 8px 28px -8px var(--v)}
.msg{color:var(--dim);padding:22px 4px;font-size:14px;line-height:1.6}
.imp{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:18px;margin:14px 0 22px}
.imp textarea,.imp input[type=text]{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font:500 14px Manrope,sans-serif;padding:12px;margin:10px 0 0;outline:none;resize:none}
.imp textarea:focus,.imp input:focus{border-color:var(--v)}
.imp .rowb{margin-top:12px}
#mini{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:6;max-width:900px;margin:auto;background:rgba(18,18,26,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--ln);border-radius:22px;padding:8px 10px;display:flex;align-items:center;gap:10px;overflow:hidden;box-shadow:0 12px 40px -12px rgba(166,107,255,.45)}
#mini img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--s1)}
#mbar{position:absolute;left:0;bottom:0;height:2px;background:var(--g);width:0;box-shadow:0 0 10px var(--c)}
#mplay{color:#06060a;background:var(--g);width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px -2px var(--v)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(7,7,11,.88);backdrop-filter:blur(18px);border-top:1px solid var(--ln);display:flex}
nav button{flex:1;background:none;border:0;color:var(--dim);font:600 10px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.2s}
nav button.on{color:#fff}nav button.on svg{color:var(--c);filter:drop-shadow(0 0 7px var(--c))}
#full{position:fixed;inset:0;z-index:40;background:radial-gradient(90% 50% at 50% 0,rgba(166,107,255,.28),transparent 70%),radial-gradient(70% 40% at 90% 100%,rgba(94,242,255,.12),transparent 70%),#08080d;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
#full.open{transform:none}
.fin{max-width:420px;margin:auto}
#stage{position:relative;width:min(80vw,380px);aspect-ratio:1;border-radius:28px;overflow:hidden;margin:14px auto 26px;box-shadow:0 0 0 1px var(--ln),0 30px 90px -20px var(--v),0 0 60px -20px var(--c);background:var(--s1)}
#fart{width:100%;height:100%;object-fit:cover}
#ytw{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.vid #ytw{opacity:1}
#ytw iframe{width:100%;height:100%;border:0}
.ft{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ft .t{font:800 22px Syne,sans-serif;white-space:normal}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:9px;margin:20px 0 6px;outline:none;background:linear-gradient(90deg,#5ef2ff,#a66bff var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--c)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--c)}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
#fplay{width:70px;height:70px;border-radius:50%;background:var(--g);color:#06060a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px -4px var(--v)}
#fplay svg{width:30px;height:30px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(236,234,246,.96);color:#000;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;box-shadow:0 0 30px -6px var(--c)}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{background:#13131b;border:1px solid var(--ln);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px;max-height:75vh;overflow:auto}
#sheet .opt{display:block;width:100%;text-align:left;padding:14px 6px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:500 15px Manrope,sans-serif}
</style>
</head>
<body>
<header>
  <div class="brand"><span data-ic="sigil"></span><b>UTA</b><small>BY SHADE REIGN</small></div>

<main>
  <section id="v-home" class="view on">

<div id="mini">
  <img id="m-art" alt="">

<div id="full"><div class="fin">

  <div id="stage"><img id="fart" alt=""><div id="ytw"><div id="yt"></div></div></div>
  <div class="ft"><div style="min-width:0"><div class="t" id="ft">Pick a song</div><div class="s" id="fa">SHADE REIGN</div></div>
    <div style="display:flex"><button class="ib st" id="flike" data-ic="heart"></button><button class="ib st" id="fadd" data-ic="plus"></button></div></div>
  <input type="range" id="fbar" min="0" max="100" value="0" step="0.1">

<nav>

<script>
const APP="UTA", FALLBACK="https://discoveryprovider.audius.co";
const $=id=>document.getElementById(id), enc=encodeURIComponent;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const dec=s=>{const t=document.createElement("textarea");t.innerHTML=s||"";return t.value};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const I={
 play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>',
 prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1.2 8.8 3 5 6.6 5c2 0 3.4 1.1 5.4 3 2-1.9 3.4-3 5.4-3C21 5 22.8 8.8 21.3 12c-2.3 4.6-9.3 9-9.3 9z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>',
 lib:'<svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 6l5 13"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>',
 shuf:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>',
 sigil:'<svg viewBox="0 0 200 300"><path d="M100 16v268M64 50l36 36 36-36M100 86l44 54-44 54-44-54zM100 164l36 48-36 48-36-48z" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=I[e.dataset.ic]);

/* ---------- storage ---------- */
let pls=LS("sr_pl")||[{id:"liked",name:"Liked songs",tracks:[]}];
const save=()=>LS("sr_pl",pls);

/* ---------- Audius (free full-length songs, no ads) ---------- */
let host=null;
async function getHost(){
  if(host)return host;
  try{host=(await(await fetch("https://api.audius.co")).json()).data;host=host[Math.floor(Math.random()*host.length)]}catch(e){host=FALLBACK}
  return host;
}
async function api(path){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch((await getHost())+"/v1"+path+(path.includes("?")?"&":"?")+"app_name="+APP);
      if(!r.ok)throw 0;return(await r.json()).data||[];
    }catch(e){host=null}
  }
  throw new Error("audius");
}
const norm=t=>({id:"a"+t.id,src:"a",aid:t.id,title:t.title||"Untitled",artist:(t.user&&t.user.name)||"Unknown",art:t.artwork?(t.artwork["480x480"]||t.artwork["150x150"]||""):"",dur:t.duration||0});

/* ---------- YouTube (millions of songs) ---------- */
const pv=u=>((u||"").match(/(?:v=|\/watch\/|youtu\.be\/)([\w-]{11})/)||[])[1];
const clean=s=>dec(s).replace(/ - Topic$/,"");
const ytTrack=(vid,title,artist,dur)=>({id:"y"+vid,src:"y",vid,title:dec(title),artist:clean(artist||""),art:"https://i.ytimg.com/vi/"+vid+"/mqdefault.jpg",dur:dur||0});
const tmo=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal};
const getJSON=(u,ms=6000)=>fetch(u,{signal:tmo(ms)}).then(r=>{if(!r.ok)throw 0;return r.json()});
const getText=(u,ms=9000)=>fetch(u,{signal:tmo(ms)}).then(r=>{if(!r.ok)throw 0;return r.text()});
const PROXY=[u=>"https://api.allorigins.win/raw?url="+enc(u),u=>"https://corsproxy.io/?"+enc(u),u=>"https://api.codetabs.com/v1/proxy?quest="+enc(u)];
const viaProxy=(u,ok)=>Promise.any(PROXY.map(p=>getText(p(u)).then(t=>{if(ok&&!ok(t))throw 0;return t})));
const PIPED=["https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de","https://api.piped.private.coffee"];
const INV=["https://inv.nadeko.net","https://yewtu.be","https://invidious.nerdvpn.de"];
const INIT=/var ytInitialData\s*=\s*(\{[\s\S]*?\});<\/script>/;
const walk=(o,f)=>{if(!o||typeof o!=="object")return;f(o);for(const k in o)walk(o[k],f)};
/* every source is tried at the same time; the first good answer wins */
function ytSearch(q){
  const src=[
    ...PIPED.map(b=>getJSON(b+"/search?q="+enc(q)+"&filter=music_songs").then(j=>j.items.filter(s=>pv(s.url)).map(s=>ytTrack(pv(s.url),s.title,s.uploaderName,s.duration)))),
    ...INV.map(b=>getJSON(b+"/api/v1/search?type=video&q="+enc(q)).then(j=>j.filter(v=>v.videoId).map(v=>ytTrack(v.videoId,v.title,v.author,v.lengthSeconds)))),
    viaProxy("https://www.youtube.com/results?search_query="+enc(q)+"&sp=EgIQAQ%3D%3D",t=>INIT.test(t)).then(t=>{
      const out=[],seen={};
      walk(JSON.parse(t.match(INIT)[1]),o=>{const v=o.videoRenderer;if(v&&v.videoId&&!seen[v.videoId]){seen[v.videoId]=1;out.push(ytTrack(v.videoId,(v.title.runs||[{}])[0].text||"",v.ownerText&&v.ownerText.runs&&v.ownerText.runs[0].text,0))}});
      return out;
    })
  ];
  return Promise.any(src.map(p=>p.then(x=>{if(!x.length)throw 0;return x})));
}

/* ---------- toast, nav ---------- */
let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}
function show(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="lib")renderLib();
  scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- rendering ---------- */
const tag=t=>t.src==="y"?"YouTube (screen on)":"Audius (background OK)";
function trackRows(list,el,opts){
  el._l=list;el._o=opts||{};el.onclick=null;el.className="list";
  if(!list.length){el.innerHTML='<div class="msg">Nothing here yet.</div>';return}
  el.innerHTML=list.map((t,i)=>`<div class="row${cur&&cur.id===t.id?" now":""}" data-i="${i}" data-id="${esc(t.id)}">

    <div class="meta" data-a="play"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)} · ${tag(t)}</div></div>

    ${el._o.removeFrom?`<button class="ib" data-a="rm" title="Remove">&#10005;</button>`:""}</div>`).join("");
}
function cardGrid(list,el,cls){
  el._l=list;el._o={};el.onclick=null;el.className="list "+(cls||"grid");
  el.innerHTML=list.map((t,i)=>`<div class="card${cur&&cur.id===t.id?" now":""}" data-i="${i}" data-id="${esc(t.id)}" data-a="play">
    ${t.art?`<img src="${esc(t.art)}" loading="lazy" alt="">`:'<div class="ph"></div>'}
    <div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>`).join("");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const box=b.closest(".list"),it=b.closest("[data-i]");
  if(!box||!box._l||!it)return;
  const i=+it.dataset.i,l=box._l;

  if(b.dataset.a==="add")pick(l[i]);
  if(b.dataset.a==="rm"){const p=pls.find(x=>x.id===box._o.removeFrom);if(p){p.tracks.splice(i,1);save();openPl(p.id)}}
});
function peopleRows(list,el,kind){
  el._l=null;
  if(!list.length){el.innerHTML='<div class="msg">No '+kind+' found. Try another spelling.</div>';return}
  el.innerHTML=list.map((x,i)=>{
    const a=kind==="artists";
    const im=a?(x.profile_picture&&(x.profile_picture["150x150"]||x.profile_picture["480x480"])):(x.artwork&&(x.artwork["150x150"]||x.artwork["480x480"]));
    const sub=a?(x.track_count||0)+" tracks":"by "+((x.user&&x.user.name)||"unknown")+" · "+(x.track_count||0)+" tracks";
    return`<div class="row ${a?"artist":""}" data-i="${i}">${im?`<img src="${esc(im)}" loading="lazy" alt="">`:'<div class="ph"></div>'}
    <div class="meta"><div class="t">${esc(a?x.name:x.playlist_name)}</div><div class="s">${esc(sub)}</div></div></div>`;
  }).join("");
  el.onclick=e=>{const r=e.target.closest(".row");if(!r)return;const x=list[+r.dataset.i];a_(kind,x)};
}
const a_=(kind,x)=>kind==="artists"?openArtist(x):openOnline(x);

/* ---------- detail ---------- */
let backTo="home";
const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function detail(title,tracks,extra,opts){
  const from=document.querySelector(".view.on").id.replace("v-","");
  if(from!=="detail")backTo=from;
  $("d-title").textContent=title;
  $("d-actions").innerHTML='<button class="btn red" id="d-play">Play</button><button class="btn" id="d-shuf">Shuffle</button>'+(extra||"");
  trackRows(tracks,$("d-list"),opts);
  $("d-play").onclick=()=>tracks.length&&playList(tracks,0);
  $("d-shuf").onclick=()=>tracks.length&&playList(shuffled(tracks),0);
  show("detail");
}
$("back").onclick=()=>show(backTo);
async function openArtist(u){
  detail(u.name,[]);$("d-list").innerHTML='<div class="msg">Loading songs…</div>';
  try{detail(u.name,(await api("/users/"+u.id+"/tracks?limit=100")).map(norm))}
  catch(e){$("d-list").innerHTML='<div class="msg">Could not load this artist. Check your internet.</div>'}
}
async function openOnline(p){
  detail(p.playlist_name,[]);$("d-list").innerHTML='<div class="msg">Loading songs…</div>';
  try{
    const d=(await api("/playlists/"+p.id+"/tracks")).map(norm);

/* ---------- home & search ---------- */
let HOME_FIRST=[];
const ROWS=[["Trending now","/tracks/trending?limit=20"],["Underground gems","/tracks/trending/underground?limit=20"],["Lo-Fi & chill","/tracks/trending?genre=Lo-Fi&limit=20"],["Hip-Hop & Rap","/tracks/trending?genre="+enc("Hip-Hop/Rap")+"&limit=20"],["Electronic","/tracks/trending?genre=Electronic&limit=20"],["Pop","/tracks/trending?genre=Pop&limit=20"],["Rock","/tracks/trending?genre=Rock&limit=20"],["Ambient","/tracks/trending?genre=Ambient&limit=20"],["Soundtrack","/tracks/trending?genre=Soundtrack&limit=20"],["R&B / Soul","/tracks/trending?genre="+enc("R&B/Soul")+"&limit=20"]];
const MOODS=["Bollywood","Punjabi","Phonk","Lofi","Anime OST","Synthwave","Gym","Arijit Singh","The Weeknd","Old Hindi"];
function goSearch(q){kind="songs";document.querySelectorAll(".chip[data-k]").forEach(x=>x.classList.toggle("on",x.dataset.k==="songs"));$("q").value=q;show("search");runSearch()}
function loadHome(){
  const h=new Date().getHours();
  $("hi").textContent=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  $("moods").innerHTML=MOODS.map(m=>`<button class="chip" data-m="${esc(m)}">${esc(m)}</button>`).join("");
  $("moods").onclick=e=>{const b=e.target.closest("[data-m]");if(b)goSearch(b.dataset.m)};
  const box=$("home-rows");box.innerHTML="";
  ROWS.forEach(([t,path],i)=>{
    const sec=document.createElement("div");
    sec.innerHTML=`<h3>${esc(t)}</h3><div class="list hrow"><div class="msg">Loading…</div></div>`;box.appendChild(sec);
    const el=sec.querySelector(".list");
    api(path).then(d=>{const l=d.map(norm);if(!l.length)throw 0;if(!HOME_FIRST.length)HOME_FIRST=l;cardGrid(l,el,"hrow")})
      .catch(()=>{if(i===0)el.innerHTML='<div class="msg">Could not reach the music server. <button class="btn" onclick="loadHome()">Try again</button></div>';else sec.remove()});
  });
}
let kind="songs",deb;
document.querySelectorAll(".chip[data-k]").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip[data-k]").forEach(x=>x.classList.remove("on"));c.classList.add("on");kind=c.dataset.k;runSearch();
});
$("q").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(runSearch,450)});
async function runSearch(){
  const q=$("q").value.trim(),el=$("search-list");
  if(!q){el.className="list";el.innerHTML='<div class="msg">Search any song or artist.</div>';return}
  el.className="list";el.innerHTML='<div class="msg">Searching…</div>';
  try{
    if(kind==="songs"){
      let A=[],Y=[];
      const draw=()=>{if(q!==$("q").value.trim())return;const out=[];for(let i=0;i<Math.max(A.length,Y.length);i++){if(Y[i])out.push(Y[i]);if(A[i])out.push(A[i])}if(out.length)trackRows(out,el)};
      await Promise.all([
        api("/tracks/search?query="+enc(q)+"&limit=15").then(d=>{A=d.map(norm);draw()}).catch(()=>{}),
        ytSearch(q).then(d=>{Y=d;draw()}).catch(()=>{})
      ]);
      if(q===$("q").value.trim()&&!A.length&&!Y.length)el.innerHTML='<div class="msg">No songs found. Check your internet or try another name.</div>';
    }
    else{
      const d=await api("/"+kind+"/search?query="+enc(q)+"&limit=30");
      if(q!==$("q").value.trim())return;
      peopleRows(d,el,kind==="users"?"artists":"playlists");
    }
  }catch(e){el.innerHTML='<div class="msg">Search failed. Check your internet and try again.</div>'}
}

/* ---------- library & playlists ---------- */
function renderLib(){
  const el=$("lib-list");el._l=null;el.className="list";
  el.innerHTML=pls.map(p=>`<div class="row" data-id="${esc(p.id)}">${p.tracks[0]&&p.tracks[0].art?`<img src="${esc(p.tracks[0].art)}" alt="">`:'<div class="ph"></div>'}
    <div class="meta"><div class="t">${esc(p.name)}</div><div class="s">${p.tracks.length} songs</div></div></div>`).join("");
  el.onclick=e=>{const r=e.target.closest(".row");if(r)openPl(r.dataset.id)};
}
function openPl(id){
  const p=pls.find(x=>x.id===id);if(!p)return;
  backTo="lib";
  detail(p.name,p.tracks,p.id==="liked"?"":'<button class="btn" id="d-del">Delete</button>',{removeFrom:p.id});
  backTo="lib";
  const d=$("d-del");
  if(d)d.onclick=()=>{if(confirm("Delete this playlist?")){pls=pls.filter(x=>x.id!==id);save();show("lib")}};
}
$("newpl").onclick=()=>{const n=prompt("Playlist name");if(n&&n.trim()){pls.push({id:"pl_"+Date.now(),name:n.trim(),tracks:[]});save();renderLib()}};
function sheet(html){$("sheet").innerHTML=html;$("modal").classList.add("on")}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on")};
function pick(t){
  if(!t)return toast("Play a song first");
  sheet('<div class="t" style="margin-bottom:6px">Add to playlist</div>'+pls.map(p=>`<button class="opt" data-id="${esc(p.id)}">${esc(p.name)} (${p.tracks.length})</button>`).join("")+'<button class="opt" data-id="__new" style="color:var(--ac)">+ New playlist</button>');
  $("sheet").onclick=e=>{
    const b=e.target.closest(".opt");if(!b)return;let p;
    if(b.dataset.id==="__new"){const n=prompt("Playlist name");if(!n||!n.trim())return;p={id:"pl_"+Date.now(),name:n.trim(),tracks:[]};pls.push(p)}
    else p=pls.find(x=>x.id===b.dataset.id);
    if(p&&!p.tracks.some(x=>x.id===t.id))p.tracks.push(t);

  };

$("gear").onclick=()=>{
  sheet('<div class="t">About UTA</div><div class="s" style="white-space:normal;margin:8px 0 14px">Install: iPhone Safari, Share, Add to Home Screen. Android Chrome, menu, Install app. Desktop Chrome or Edge, install icon in the address bar.<br><br>Audius songs keep playing with the screen off. YouTube songs need the screen on.</div><button class="btn" id="wipe">Clear my library</button>');
  $("sheet").onclick=null;
  $("wipe").onclick=()=>{if(confirm("Delete all playlists and likes?")){pls=[{id:"liked",name:"Liked songs",tracks:[]}];save();$("modal").classList.remove("on");renderLib();toast("Library cleared")}};
};

/* ---------- import (YouTube, Spotify, CSV, text) ---------- */
async function pool(items,n,fn){const out=new Array(items.length);let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;out[k]=await fn(items[k],k)}}));return out}
function ytPlaylistIds(id){
  return new Promise((res,rej)=>{
    if(!window.YT||!YT.Player)return rej(new Error("yt"));
    const box=document.createElement("div");box.style.cssText="position:fixed;left:-9999px;top:0;width:220px;height:220px";
    const d=document.createElement("div");box.appendChild(d);document.body.appendChild(box);
    let done=false,p,poll;
    const fin=(ok,v)=>{if(done)return;done=true;clearTimeout(to);clearInterval(poll);try{p.destroy()}catch(e){}box.remove();ok?res(v):rej(v)};
    const to=setTimeout(()=>fin(false,new Error("timeout")),9000);
    p=new YT.Player(d,{width:220,height:220,playerVars:{listType:"playlist",list:id},events:{
      onReady:()=>{poll=setInterval(()=>{try{const l=p.getPlaylist();if(l&&l.length)fin(true,[...new Set(l)])}catch(e){}},250)},
      onError:()=>fin(false,new Error("blocked"))
    }});
  });
}
async function vidMeta(v){
  const u="https://www.youtube.com/watch?v="+v;
  const f=url=>getJSON(url,6000).then(j=>{if(!j.title)throw 0;return ytTrack(v,j.title,j.author_name)});
  try{return await Promise.any([f("https://www.youtube.com/oembed?format=json&url="+enc(u)),f("https://noembed.com/embed?url="+enc(u))])}
  catch(e){return ytTrack(v,"Track "+v.slice(0,5),"")}
}
async function scrapePlaylist(id){
  const t=await viaProxy("https://www.youtube.com/playlist?list="+id,t=>INIT.test(t));
  const D=JSON.parse(t.match(INIT)[1]),tr=[],seen={};
  walk(D,o=>{const v=o.playlistVideoRenderer;if(v&&v.videoId&&!seen[v.videoId]&&v.title){seen[v.videoId]=1;tr.push(ytTrack(v.videoId,(v.title.runs&&v.title.runs[0].text)||v.title.simpleText||"",v.shortBylineText&&v.shortBylineText.runs&&v.shortBylineText.runs[0].text,+v.lengthSeconds||0))}});
  let name="YouTube playlist";try{name=D.metadata.playlistMetadataRenderer.title||name}catch(e){}
  if(!tr.length)throw new Error("empty");
  return{name,tracks:tr};
}
/* two ways run at the same time (YouTube's own player, and reading the page); the faster one wins */
function importYT(id,P){
  P("Reading playlist…");
  const viaPlayer=ytPlaylistIds(id).then(async ids=>{
    let n=0;
    const tracks=await pool(ids,10,async v=>{const t=await vidMeta(v);P("Loading song names "+(++n)+"/"+ids.length+"…");return t});
    return{name:"YouTube playlist",tracks};
  });
  return Promise.any([viaPlayer,scrapePlaylist(id)]);
}
async function spotifyList(kind,id){
  const h=await viaProxy("https://open.spotify.com/embed/"+kind+"/"+id,t=>/__NEXT_DATA__/.test(t));
  const m=h.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);if(!m)throw 0;
  const e=JSON.parse(m[1]).props.pageProps.state.data.entity;
  return{name:e.name||e.title||"Spotify playlist",lines:(e.trackList||[]).map(t=>t.title+" - "+(t.subtitle||""))};
}
const csvRow=l=>{const o=[];l.replace(/("([^"]|"")*"|[^,]*)(,|$)/g,(m,a)=>{o.push(a.replace(/^"|"$/g,"").replace(/""/g,'"'));return""});return o};
function parseLines(t){
  const L=t.split(/\r?\n/).filter(x=>x.trim());
  if(L.length&&/track name/i.test(L[0])){
    const h=csvRow(L[0]).map(x=>x.toLowerCase()),ti=h.findIndex(x=>x.startsWith("track name")),ai=h.findIndex(x=>x.startsWith("artist name"));
    return L.slice(1).map(l=>{const c=csvRow(l);return(c[ti]||"")+" - "+((c[ai]||"").split(";")[0])});
  }
  return L.map(l=>l.replace(/^\d+[.)]\s*/,"").trim());
}
async function resolve(lines,prog){
  let n=0;
  const r=await pool(lines,5,async l=>{
    const q=l.replace(/\s*-\s*$/,"");let out=null;
    try{out=(await ytSearch(q))[0]}catch(e){}
    if(!out)try{const a=await api("/tracks/search?query="+enc(q)+"&limit=1");if(a[0])out=norm(a[0])}catch(e){}
    prog("Matching "+(++n)+" of "+lines.length+"…");return out;
  });
  return r.filter(Boolean);
}
$("impf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("imp").value=r.result;toast("File loaded. Tap Import")};r.readAsText(f)};
$("impgo").onclick=async()=>{
  const raw=$("imp").value.trim(),P=m=>$("impp").textContent=m;
  if(!raw)return toast("Paste a link or a song list first");
  let name=$("impn").value.trim(),tracks=[];
  const yl=raw.match(/[?&]list=([\w-]+)/),sp=raw.match(/open\.spotify\.com\/(?:intl-\w+\/)?(playlist|album)\/(\w+)/);
  P("Working…");
  try{
    if(yl){const r=await importYT(yl[1],P);tracks=r.tracks;name=name||r.name}
    else if(sp){
      let r;try{r=await spotifyList(sp[1],sp[2])}catch(e){return P("Spotify would not share this playlist. Export it as CSV at exportify.net (or tunemymusic.com) and upload the file here, or paste the song names.")}
      name=name||r.name;tracks=await resolve(r.lines.slice(0,100),P);
    }else{name=name||"Imported songs";tracks=await resolve(parseLines(raw).slice(0,100),P)}
  }catch(e){return P("Could not read this playlist. It must be Public or Unlisted (not Private). Check your internet and try again, or paste the song names instead.")}
  if(!tracks.length)return P("The playlist loaded but no songs could be read. Make sure it is Public or Unlisted, then try again.");
  pls.push({id:"pl_"+Date.now(),name,tracks});save();
  $("imp").value="";$("impn").value="";P("Imported "+tracks.length+" songs into \""+name+"\".");renderLib();
};

/* ---------- player (Audius audio + YouTube player) ---------- */
const au=$("au");
let Q=[],qi=-1,cur=null,shuf=false,rep=false,yt=null,ytReady=false,pend=null,fails=0,seeking=false;
function onYouTubeIframeAPIReady(){
  yt=new YT.Player("yt",{width:"100%",height:"100%",playerVars:{playsinline:1,controls:0,disablekb:1,rel:0,modestbranding:1},events:{
    onReady:()=>{ytReady=true;if(pend){yt.loadVideoById(pend);pend=null}},
    onStateChange:e=>{if(e.data===0)ended();if(e.data===1)fails=0;if(e.data===1||e.data===2)setPlay(e.data===1)},
    onError:()=>fail()
  }});
}
function playList(l,i){Q=l.slice();qi=i;go()}
function go(){
  cur=Q[qi];if(!cur)return;
  if(cur.src==="y"){
    au.pause();$("stage").classList.add("vid");
    if(ytReady)yt.loadVideoById(cur.vid);else pend=cur.vid;
  }else{
    if(ytReady)yt.stopVideo();pend=null;$("stage").classList.remove("vid");
    au.src=(host||FALLBACK)+"/v1/tracks/"+cur.aid+"/stream?app_name="+APP;
    au.play().catch(()=>{});
  }
  ui();
}
function ui(){
  $("m-title").textContent=$("ft").textContent=cur.title;
  $("m-artist").textContent=$("fa").textContent=cur.artist;
  $("m-art").src=$("fart").src=cur.art||"";
  updLike();setPlay(true);
  document.querySelectorAll("[data-id]").forEach(r=>r.classList.toggle("now",r.dataset.id===cur.id));
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,artwork:cur.art?[{src:cur.art}]:[]});
    const M=navigator.mediaSession;M.setActionHandler("nexttrack",next);M.setActionHandler("previoustrack",prev);M.setActionHandler("play",toggle);M.setActionHandler("pause",toggle);
  }
}
function setPlay(p){$("mplay").innerHTML=$("fplay").innerHTML=p?I.pause:I.play;if("mediaSession" in navigator)navigator.mediaSession.playbackState=p?"playing":"paused"}
const isPlaying=()=>cur&&(cur.src==="y"?ytReady&&yt.getPlayerState&&yt.getPlayerState()===1:!au.paused);
function toggle(){
  if(!cur){if(HOME_FIRST.length)playList(HOME_FIRST,0);return}
  if(cur.src==="y"){if(!ytReady)return;isPlaying()?yt.pauseVideo():yt.playVideo()}
  else au.paused?au.play():au.pause();
}
function next(){if(!Q.length)return;qi=shuf&&Q.length>1?Math.floor(Math.random()*Q.length):(qi+1)%Q.length;go()}
function prev(){
  if(!Q.length)return;
  const t=cur.src==="y"&&ytReady?yt.getCurrentTime():au.currentTime;
  if(t>3){cur.src==="y"?yt.seekTo(0,true):au.currentTime=0;return}
  qi=(qi-1+Q.length)%Q.length;go();
}
function ended(){if(rep){cur.src==="y"?yt.seekTo(0,true):(au.currentTime=0,au.play());if(cur.src==="y")yt.playVideo();return}next()}
function fail(){fails++;if(fails>3){toast("Playback keeps failing. Check your internet.");return}toast("Can't play this one, skipping");next()}
au.onplay=()=>setPlay(true);au.onpause=()=>setPlay(false);au.onended=ended;au.onerror=()=>cur&&cur.src==="a"&&fail();au.onplaying=()=>fails=0;
$("mplay").onclick=$("fplay").onclick=toggle;
$("mnext").onclick=$("fnext").onclick=next;$("fprev").onclick=prev;
$("fshuf").onclick=()=>{shuf=!shuf;$("fshuf").classList.toggle("on",shuf)};
$("frep").onclick=()=>{rep=!rep;$("frep").classList.toggle("on",rep)};
$("m-open").onclick=$("m-art").onclick=()=>$("full").classList.add("open");
$("fclose").onclick=()=>$("full").classList.remove("open");
const fbar=$("fbar");fbar.oninput=()=>fbar.style.setProperty("--p",fbar.value+"%");
fbar.onpointerdown=()=>seeking=true;
fbar.onchange=()=>{
  if(!cur){seeking=false;return}
  const p=+fbar.value/100;
  if(cur.src==="y"&&ytReady)yt.seekTo(p*yt.getDuration(),true);else if(au.duration)au.currentTime=p*au.duration;
  seeking=false;
};
setInterval(()=>{
  if(!cur)return;let t=0,d=0;
  if(cur.src==="y"){if(!ytReady||!yt.getCurrentTime)return;t=yt.getCurrentTime();d=yt.getDuration()}
  else{t=au.currentTime;d=au.duration||cur.dur}
  d=d||0;const p=d?t/d*100:0;
  $("tc").textContent=fmt(t);$("td").textContent=fmt(d);$("mbar").style.width=p+"%";
  if(!seeking){fbar.value=p;fbar.style.setProperty("--p",p+"%")}
},500);
function updLike(){const l=cur&&pls[0].tracks.some(t=>t.id===cur.id);$("flike").classList.toggle("liked",!!l)}
$("flike").onclick=()=>{
  if(!cur)return toast("Play a song first");
  const t=pls[0].tracks,i=t.findIndex(x=>x.id===cur.id);i<0?t.push(cur):t.splice(i,1);save();updLike();
};
$("fadd").onclick=()=>pick(cur);
setPlay(false);loadHome();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
